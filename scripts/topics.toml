# Topic pages on tenderkit.pl/przetargi/<slug>, rebuilt daily by scripts/build_topic_pages.py.
# cpv: CPV codes or prefixes ending in *, as in tenderkit's search_notices. intro: one or two sentences in Polish,
# shown under the heading; numbers come from the data, not from here.

[[topic]]
slug = "karetki"
name = "karetki i ambulanse"
title = "Przetargi na karetki i ambulanse"
cpv = ["3411412*"]
prompt = "Pokaż otwarte przetargi na karetki z terminem składania ofert w ciągu 14 dni."
intro = "Zakupy ambulansów typu B i C, karetek 4x4 i pojazdów do przewozu chorych przez szpitale, stacje pogotowia i powiaty."

